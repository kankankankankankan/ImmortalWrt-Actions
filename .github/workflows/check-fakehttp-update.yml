# 只检查自己仓库的 x86_64 成品；失败不记为已更新。
name: Check FakeHTTP Update

on:
  schedule:
    # UTC 每月奇数日 00:00，北京时间 08:00。
    - cron: "0 0 */2 * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "忽略版本差异，强制触发固件构建"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: fakehttp-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check release and trigger firmware build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force_build == true && 'true' || 'false' }}
        run: |
          # 对比资产 ID 和校验值，同名 Release 替换附件也能发现。
          release=$(gh api repos/kankankankankankan/FakeHTTP/releases/latest)
          version=$(printf '%s' "$release" | jq -er '
            [.assets[] | select(.name == "fakehttp-linux-x86_64.tar.gz" and .state == "uploaded")]
            | if length == 1 then .[0] else error("缺少唯一 x86_64 成品") end
            | if (.digest // "" | test("^sha256:[0-9a-f]{64}$"))
              then "\(.id):\(.digest[7:])" else error("缺少 SHA256 校验值") end')
          [[ "$version" =~ ^[1-9][0-9]*:[0-9a-f]{64}$ ]] || exit 1
          known=$(tr -d '\r\n' < .fakehttp_version)
          if [ "$FORCE" != true ] && [ "$version" = "$known" ]; then
            printf '%s\n' '成品没有变化，无需编译'
            exit 0
          fi
          for status in queued in_progress waiting pending requested; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ImmortalWrt-builder.yml/runs?status=$status&per_page=1" --jq '.total_count')
            [[ "$count" =~ ^[0-9]+$ ]] || exit 1
            if [ "$count" -gt 0 ]; then
              printf '%s\n' '已有固件构建，留待下次检查'
              exit 0
            fi
          done
          # 构建时再获取最新完整 Release；只在构建并发布成功后记录实际下载版本。
          gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=fakehttp-update
