# 代码
name: ImmortalWrt Builder


on:

  repository_dispatch:
    types: [fakehttp-update]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v24.10.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

# 防止手动和定时同时构建；不打断已经开始的编译。
concurrency:
  group: immortalwrt-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true
        
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment # clang llvm npm
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang llvm nodejs npm flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget qemu-utils
        sudo npm install -g pnpm
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        
    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH immortalwrt
        ln -sf /workdir/immortalwrt $GITHUB_WORKSPACE/immortalwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF immortalwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd immortalwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
                    
    - name: Update and install feeds
      run: |
        set -euo pipefail
        cd immortalwrt
        # 强制重新获取自定义 feed，避免沿用旧的 dae 包。
        rm -rf feeds/immortalwrt
        ./scripts/feeds update immortalwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Record ImmortalWrt-Packages revision
      run: |
        set -euo pipefail
        feed_dir="$GITHUB_WORKSPACE/immortalwrt/feeds/immortalwrt"
        [ -d "$feed_dir/.git" ] || { echo 'ImmortalWrt-Packages feed not found' >&2; exit 1; }
        commit=$(git -C "$feed_dir" rev-parse HEAD)
        echo "PACKAGE_FEED_DIR=$feed_dir" >> "$GITHUB_ENV"
        echo "PACKAGE_FEED_COMMIT=$commit" >> "$GITHUB_ENV"
        echo "Packages feed commit: $commit"
       
    # 版本查询留在工作流，下载脚本只负责下载、解压和生成启动文件。
    - name: Get FakeHTTP release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        release=$(gh api repos/kankankankankankan/FakeHTTP/releases/latest)
        tag=$(printf '%s' "$release" | jq -er '.tag_name')
        [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || exit 1
        asset=$(printf '%s' "$release" | jq -ec '[.assets[] | select(.name == "fakehttp-linux-x86_64.tar.gz" and .state == "uploaded")] | if length == 1 then .[0] else error("缺少唯一 x86_64 成品") end')
        id=$(printf '%s' "$asset" | jq -er '.id | tostring')
        sha=$(printf '%s' "$asset" | jq -er '.digest | select(startswith("sha256:")) | ltrimstr("sha256:")')
        [[ "$id" =~ ^[1-9][0-9]*$ && "$sha" =~ ^[0-9a-f]{64}$ ]] || exit 1
        printf 'FAKEHTTP_URL=https://github.com/kankankankankankan/FakeHTTP/releases/download/%s/fakehttp-linux-x86_64.tar.gz\nFAKEHTTP_SHA256=%s\nFAKEHTTP_VERSION=%s:%s\n' "$tag" "$sha" "$id" "$sha" >> "$GITHUB_ENV"

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files immortalwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE immortalwrt/.config
        chmod +x $DIY_P2_SH
        cd immortalwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Write build marker
      run: |
        set -e
        BUILD_TAG="$(date +"%Y.%m.%d-%H%M")"
        BUILD_TIME="$(date +"%Y-%m-%d %H:%M:%S %Z")"
        SHORT_SHA="${GITHUB_SHA::7}"
        echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

        mkdir -p immortalwrt/files/etc
        cat > immortalwrt/files/etc/kankan_build_info <<EOF
        Build Tag: $BUILD_TAG
        Build Time: $BUILD_TIME
        Git Commit: $GITHUB_SHA
        Git Short Commit: $SHORT_SHA
        GitHub Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
        Source Repo: $REPO_URL
        Source Branch: $REPO_BRANCH
        FakeHTTP Version: ${FAKEHTTP_VERSION:-unknown}
        FakeHTTP SHA256: ${FAKEHTTP_SHA256:-unknown}
        EOF

    - name: Download package
      run: |
        cd immortalwrt
        curl -sSL https://raw.githubusercontent.com/chenmozhijin/turboacc/luci/add_turboacc.sh -o add_turboacc.sh
        bash add_turboacc.sh --no-sfe        
        make defconfig

        # dae 核心跟随 ImmortalWrt-Packages，清理旧的目标缓存，避免固件继续打入旧版。
        make package/dae/clean package/daed/clean V=s || true
        rm -rf tmp/.packageinfo tmp/.config-package.in \
          build_dir/target-*/dae-* build_dir/target-*/daed-* \
          bin/packages/*/*/dae_*.ipk bin/packages/*/*/daed_*.ipk

        dae_makefile=feeds/immortalwrt/dae/Makefile
        [ -f "$dae_makefile" ] || { echo 'dae Makefile not found in custom feed' >&2; exit 1; }
        dae_version=$(sed -n 's/^PKG_VERSION:=//p' "$dae_makefile" | head -n1)
        [ -n "$dae_version" ] || { echo 'dae package version is empty' >&2; exit 1; }
        echo "dae package version selected: $dae_version"
        # FakeHTTP 使用 files/ 中的静态成品，不允许 feed 包重新覆盖。
        if grep -Eq '^CONFIG_PACKAGE_(fakehttp|luci-app-fakehttp)=y$' .config; then
          printf '%s\n' '错误：请取消 feed 中的 FakeHTTP 核心及 LuCI' >&2
          exit 1
        fi
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        set -e
        cd immortalwrt
        echo -e "$(nproc) thread compile"

        make -j$(nproc) || make -j1 V=s

        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Verify dae package version
      if: steps.compile.outputs.status == 'success'
      run: |
        set -euo pipefail
        cd immortalwrt
        dae_pkg=$(find bin/packages -type f -name 'dae_*.ipk' | head -n1)
        [ -n "$dae_pkg" ] || { echo '编译产物中未找到 dae 软件包' >&2; exit 1; }
        pkg_version=$(tar -xOzf "$dae_pkg" ./control.tar.gz | tar -xzO ./control | sed -n 's/^Version: //p' | head -n1)
        feed_version=$(sed -n 's/^PKG_VERSION:=//p' feeds/immortalwrt/dae/Makefile | head -n1)
        echo "dae package version: $pkg_version"
        echo "dae feed version: $feed_version"
        [ "$pkg_version" = "$feed_version-1" ] || [ "$pkg_version" = "$feed_version" ] || { echo 'dae 软件包版本与 feed 不一致' >&2; exit 1; }

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        set -e
        cd immortalwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Convert OpenWrt image to ESXi VMDK
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        set -e
        cd immortalwrt/bin/targets/*/*
        
        # 1. 查找 EFI 镜像
        IMG_GZ=$(ls *squashfs*combined-efi*.img.gz 2>/dev/null | head -n 1)
        [ -z "$IMG_GZ" ] && echo "EFI combined image not found" && exit 1

        # 2. 解压镜像
        # 关键修改：使用 gzip -d -k (keep) 保留源文件，这样上传时 EFI 固件还在
        # 加上 || true 忽略解压时的警告，防止脚本中断
        echo "Decompressing $IMG_GZ ..."
        gzip -d -k "$IMG_GZ" || true

        IMG="${IMG_GZ%.gz}"
        
        # 检查解压是否真的成功（文件是否存在）
        if [ ! -f "$IMG" ]; then
          echo "ERROR: Decompression failed."
          exit 1
        fi
        
        VMDK_NAME="${IMG%.img}-esxi.vmdk"
        FLAT_VMDK="${VMDK_NAME%.vmdk}-flat.vmdk"

        # 3. 转换为 VMDK (monolithicFlat)
        echo "Converting to ESXi VMDK..."
        qemu-img convert -f raw -O vmdk -o subformat=monolithicFlat "$IMG" "$VMDK_NAME"
        
        # 4. 修正 flat 文件名 (强校验)
        if [ ! -f "$FLAT_VMDK" ]; then
           echo "Warning: Flat file not found by expected name, checking directory..."
           ls -lh *.vmdk
           # 尝试找最大的 vmdk 文件
           REAL_FLAT=$(find . -name "*.vmdk" -type f -size +100M | head -n 1)
           if [ -n "$REAL_FLAT" ] && [ "$REAL_FLAT" != "./$VMDK_NAME" ]; then
              mv "$REAL_FLAT" "$FLAT_VMDK"
           else
              echo "ERROR: ESXi flat vmdk generation failed"
              exit 1
           fi
        fi

        # 5. 打包 VMDK
        zip -r "${VMDK_NAME}.zip" "$VMDK_NAME" "$FLAT_VMDK"
        
        # 6. 清理中间文件 (保留原始 .img.gz 用于上传)
        rm -f "$IMG" "$VMDK_NAME" "$FLAT_VMDK"

    - name: Cleanup firmware files
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd immortalwrt/bin/targets/*/*

        # 只保留以下文件：
        # 1) squashfs-combined-efi.img.gz
        # 2) squashfs-combined.img.gz
        # 3) config.buildinfo
        # 4) *-esxi.vmdk.zip
        for file in *; do
          [ -f "$file" ] || continue
          case "$file" in
            *squashfs-combined-efi.img.gz|*squashfs-combined.img.gz|config.buildinfo|*esxi.vmdk.zip) ;;
            *) rm -f -- "$file" ;;
          esac
        done

        echo "=== Final firmware files ==="
        ls -lh

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        RELEASE_TAG="${BUILD_TAG:-$(date +"%Y.%m.%d-%H%M")}"
        echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        previous_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
        previous_commit=''
        if [ -n "$previous_tag" ]; then
          previous_body=$(gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' 2>/dev/null || true)
          previous_commit=$(printf '%s\n' "$previous_body" | sed -n 's/^Packages feed commit: `\([0-9a-f]\{40\}\)`.*/\1/p' | head -n 1)
        fi
        git -C "$PACKAGE_FEED_DIR" fetch --unshallow --quiet 2>/dev/null || true

        {
          echo "## 固件编译"
          echo
          echo "构建标识：\`$RELEASE_TAG\`。"
          echo
          echo "基于 ImmortalWrt ${REPO_BRANCH}，架构：x86_64。"
          echo
          echo "## ImmortalWrt-Packages 更新"
          echo
          echo "Packages feed commit: \`$PACKAGE_FEED_COMMIT\`."
          echo
        } > release.txt

        if [ -n "$previous_commit" ] && git -C "$PACKAGE_FEED_DIR" cat-file -e "$previous_commit^{commit}" 2>/dev/null; then
          echo "比较范围：\`$previous_commit\` → \`$PACKAGE_FEED_COMMIT\`." >> release.txt
          echo >> release.txt
          echo '### 更新插件' >> release.txt
          changed_packages=$(git -C "$PACKAGE_FEED_DIR" diff --name-only "$previous_commit" "$PACKAGE_FEED_COMMIT" \
            | awk -F/ 'NF >= 2 {print $1}' | sort -u)
          if [ -n "$changed_packages" ]; then
            printf '%s\n' "$changed_packages" | sed 's/^/- `/' | sed 's/$/`/' >> release.txt
          else
            echo '- 本次没有检测到插件目录变化。' >> release.txt
          fi
          echo >> release.txt
          echo '### 修复与变更说明' >> release.txt
          changes=$(git -C "$PACKAGE_FEED_DIR" log --no-merges --format='- %s (%h)' "$previous_commit..$PACKAGE_FEED_COMMIT")
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes" | head -n 100 >> release.txt
          else
            echo '- 本次没有新的提交说明。' >> release.txt
          fi
          echo >> release.txt
          echo "完整变更： https://github.com/kankankankankankan/ImmortalWrt-Packages/compare/$previous_commit...$PACKAGE_FEED_COMMIT" >> release.txt
        else
          echo '这是首次记录 Packages feed 版本，后续 Release 将生成增量更新说明。' >> release.txt
          echo >> release.txt
          echo "本次提交： https://github.com/kankankankankankan/ImmortalWrt-Packages/commit/$PACKAGE_FEED_COMMIT" >> release.txt
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Install COSCLI
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        wget -q https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 -O coscli
        chmod +x coscli
        sudo mv coscli /usr/local/bin/

    - name: Upload firmware to Tencent COS
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        set -e

        DATE_TAG="$(date +"%Y%m%d%H%M")"
        COS_UPLOAD_DIR="/tmp/cos_upload"

        rm -rf "$COS_UPLOAD_DIR"
        mkdir -p "$COS_UPLOAD_DIR"

        cd "${{ env.FIRMWARE }}"

        for file in *; do
          [ -f "$file" ] || continue

          case "$file" in
            *.img.gz)
              base="${file%.img.gz}"
              cp "$file" "$COS_UPLOAD_DIR/${base}_${DATE_TAG}.img.gz"
              ;;
            *.vmdk.zip)
              base="${file%.vmdk.zip}"
              cp "$file" "$COS_UPLOAD_DIR/${base}_${DATE_TAG}.vmdk.zip"
              ;;
            config.buildinfo)
              cp "$file" "$COS_UPLOAD_DIR/config_${DATE_TAG}.buildinfo"
              ;;
          esac
        done

        echo "=== COS upload files ==="
        ls -lh "$COS_UPLOAD_DIR"

        coscli cp "$COS_UPLOAD_DIR/" cos://file-vemhbtkmw-1252854513/firmware/ImmortalWrt/${DATE_TAG}/ --recursive \
          -i "${{ secrets.COS_SECRET_ID }}" \
          -k "${{ secrets.COS_SECRET_KEY }}" \
          -e "cos.accelerate.myqcloud.com"

    - name: Upload firmware to release
      id: release
      uses: softprops/action-gh-release@master
      if: success() && steps.compile.outputs.status == 'success' && steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    # 只记录真正下载且随固件发布成功的资产，不在检查更新时提前写入。
    - name: Record successful FakeHTTP version
      if: success() && steps.release.outcome == 'success' && github.ref_name == github.event.repository.default_branch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        [[ "$FAKEHTTP_VERSION" =~ ^[1-9][0-9]*:[0-9a-f]{64}$ ]] || exit 1
        path="repos/$GITHUB_REPOSITORY/contents/.fakehttp_version"
        current=$(gh api "$path?ref=$DEFAULT_BRANCH")
        known=$(printf '%s' "$current" | jq -er '.content' | base64 -d)
        if [ "$known" = "$FAKEHTTP_VERSION" ]; then
          printf '%s\n' 'FakeHTTP 版本未变化，无需重复写入'
          exit 0
        fi
        blob=$(printf '%s' "$current" | jq -er '.sha')
        content=$(printf '%s\n' "$FAKEHTTP_VERSION" | base64 -w 0)
        gh api "$path" -X PUT -f message="chore: record FakeHTTP $FAKEHTTP_VERSION" \
          -f content="$content" -f sha="$blob" -f branch="$DEFAULT_BRANCH" >/dev/null
        # Contents API 偶尔会在 PUT 后短暂读到旧内容；只对读回校验做短重试。
        for i in 1 2 3 4 5; do
          actual=$(gh api "$path?ref=$DEFAULT_BRANCH" --jq '.content' | base64 -d)
          [ "$actual" = "$FAKEHTTP_VERSION" ] && exit 0
          sleep 2
        done
        printf '%s\n' 'FakeHTTP 版本写入后读回不一致' >&2
        exit 1

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Bark notify
      if: always()
      run: |
        STATUS="成功"
        if [ "${{ job.status }}" != "success" ]; then STATUS="失败"; fi
        curl -s "https://api.day.app/${{ secrets.BARK_KEY }}/ImmortalWrt构建${STATUS}/ESXi%20VMDK已生成?group=ImmortalWrt-Actions"
